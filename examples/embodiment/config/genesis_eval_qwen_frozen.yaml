# Strict Genesis side of the frozen QwenNavPolicy A/B evaluation.
# This mirrors habitat_eval_qwen_frozen.yaml; only the simulator backend differs.

defaults:
  - env/genark_r2r@env.train
  - env/genark_r2r@env.eval
  - model/qwen_nav@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor:
      placement: "3"
    rollout:
      placement: "3"
    env:
      placement: "4:0"

runner:
  task_type: embodied
  only_eval: true
  eval_policy_path: null
  val_check_interval: -1
  save_interval: 999999
  max_epochs: 1
  max_steps: -1
  logger:
    log_path: /home/clk/workspace/results/rlinf_genesis_qwen_frozen
    project_name: rlinf
    experiment_name: rlinf_genesis_qwen_frozen
    logger_backends: [tensorboard]

algorithm:
  rollout_epoch: 1
  eval_rollout_epoch: 1
  group_size: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  normalize_advantages: true
  loss_type: embodied_dagger
  adv_type: gae
  recompute_logprobs: false
  kl_penalty: kl
  kl_beta: 0.0
  entropy_bonus: 0.0
  update_epoch: 1
  sampling_params:
    # LHX navigate_or_backtrack() calls the vLLM/OpenAI endpoint with
    # temperature=0.0. Keep frozen Genesis evaluation deterministic too.
    do_sample: false
    temperature_train: 0.0
    temperature_eval: 0.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: null
    min_length: 1

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  enable_offload: true
  model:
    model_type: qwen_nav
    model_path: /home/lhx/workspace/models/qwen3.5_awr
    prompt_style: lavira_waypoint
    attn_implementation: sdpa
    history_max_frames: 1
    min_pixels: 4096
    max_pixels: 122500
    lavira_source_prompt_alignment: true
    max_new_tokens: 256
    chunk_size: 8
    do_sample: false
    temperature: 0.0
    is_lora: false
    collect_forward_inputs: false
    skip_rollout_logprobs: true
    lavira_runtime:
      enabled: true
      map_backend: source
      map_device: cuda
      initial_scan_turns: 12
      map_resolution_cm: 5
      map_size_cm: 2400
      map_frame_width: 160
      map_frame_height: 120
      fmm_goal_threshold_m: 0.75
      max_steps_to_target: 15
      hfov_deg: 105.0
      camera_height: 1.25
      layered_history: true
      history_wp_max: 8
      layered_backtrack_radius_m: 6.0
      backtrack_second_chance: true
    grounded_sam:
      enabled: true
      dino_config_path: /home/clk/workspace/RLinf/assets/grounded_sam/GroundingDINO_SwinT_OGC.py
      dino_checkpoint_path: /home/clk/workspace/RLinf/assets/grounded_sam/groundingdino_swint_ogc.pth
      repvit_sam_checkpoint_path: /home/nvme01/uni-lavira/data/grounded_sam/repvit_sam.pt
      device: cuda
      box_threshold: 0.25
      text_threshold: 0.25
      fail_fast_on_missing_assets: true
  fsdp_config:
    use_orig_params: true
    cpu_offload: true

rollout:
  group_name: RolloutGroup
  backend: vllm_embodied
  enable_offload: false
  pipeline_stage_num: 1
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.25
  max_model_len: 8192
  max_num_seqs: 8
  enforce_eager: true
  model:
    model_type: qwen_nav
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    collect_forward_inputs: false
    skip_rollout_logprobs: true
    max_new_tokens: ${actor.model.max_new_tokens}
    history_max_frames: ${actor.model.history_max_frames}
    lavira_source_prompt_alignment: ${actor.model.lavira_source_prompt_alignment}
    chunk_size: ${actor.model.chunk_size}
    temperature: ${actor.model.temperature}
    do_sample: ${actor.model.do_sample}
    trust_remote_code: ${actor.model.trust_remote_code}
    attn_implementation: ${actor.model.attn_implementation}
    image_size: ${actor.model.image_size}
    min_pixels: ${actor.model.min_pixels}
    max_pixels: ${actor.model.max_pixels}
    prompt_style: ${actor.model.prompt_style}
    lavira_runtime: ${actor.model.lavira_runtime}
    grounded_sam: ${actor.model.grounded_sam}
    is_lora: false

reward:
  use_reward_model: false
critic:
  use_critic_model: false

env:
  group_name: EnvGroup
  train:
    total_num_envs: 1
  eval:
    env_type: genark
    episodes_file: /home/clk/workspace/genark/data/datasets/OpenNav_R2R-CE_100_bertidx.json
    total_num_envs: 4
    num_envs: 4
    episode_overfit:
      enabled: true
      scene_id: mp3d/TbHJrupSAjP/TbHJrupSAjP.glb
      episode_id: 259
    genesis_backend: local
    auto_reset: true
    ignore_terminations: false
    is_eval: true
    cyclic_episode_sampling: false
    eval_roll_through_episode_pool: false
    group_size: 1
    # Match Habitat A/B's 20-decision budget; GenArk records no_stop on timeout.
    max_episode_steps: 20
    max_steps_per_rollout_epoch: 20
    camera_height: 1.25
    step_move: 0.25
    step_turn: 0.5236
    fov: 105
    cam_res: [640, 480]
    enable_4dir_render: true
    enable_depth_obs: true
    enable_4dir_depth_obs: true
    success_distance: 3.0
    init_params:
      episodes_file: /home/clk/workspace/genark/data/datasets/OpenNav_R2R-CE_100_bertidx.json
      scene_datasets: /home/clk/workspace/genark/scene_datasets
      glb_cache_dir: /home/clk/workspace/RLinf/assets/ab_scene_original
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
      info_on_video: false
      fps: 3
