defaults:
  - env/genark_r2r@env.train
  - env/genark_r2r@env.eval
  - model/qwen_nav@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout:
      placement: 2
    actor:
      placement: 2
    env:
      placement: 3-5

runner:
  task_type: embodied
  logger:
    log_path: "/home/clk/workspace/results/genark_grpo_qwen"
    project_name: rlinf
    experiment_name: "genark_grpo_qwen_nav"
    logger_backends: ["tensorboard"]

  max_epochs: 500
  max_steps: -1

  only_eval: False
  val_check_interval: 50
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 4               # 4 episodes per instruction for GRPO

  rollout_epoch: 4            # collect 4 rollout epochs before one actor update
  eval_rollout_epoch: 1

  # reward stays action_level (one reward per env step), but ratio computed per-token
  # to avoid exp(sum_64_tokens) explosion. Standard PPO/GRPO pattern (VeRL, TRL).
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  # Actor-side recompute of prev_logprobs before PPO training. Eliminates the
  # cross-process forward divergence between actor (FSDP+PEFT) and rollout (raw HF):
  # PPO's old/new logprobs are both produced by the same actor model, so ratio
  # starts at ≈1.0 on the first optimizer step and only drifts as weights update.
  recompute_prev_logprobs: True
  # importance_sampling_fix: False    # leave off until recompute is validated
  # importance_sampling_clip: 5.0

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  # Per-token log_ratio safety bound. With recompute_prev_logprobs=True the
  # actor/rollout path divergence is gone, so the bound mostly only catches
  # within-update drift across multiple optimizer steps. Relaxed to ±5; can be
  # set to null once stability is confirmed over 50+ steps.
  clip_log_ratio_min: -5.0
  clip_log_ratio_max: 5.0
  value_clip: null
  huber_delta: null

  gamma: 1.0
  gae_lambda: 1.0

  reward_coef: 1.0
  filter_rewards: False

  sampling_params:
    do_sample: True
    temperature_train: 1.0   # used by action_level logprob rescaling
    temperature_eval: -1
    top_k: -1
    top_p: 1.0

  length_params:
    max_new_token: null
    max_length: null
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 12            # 3 workers × 4 envs each
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    max_episode_steps: 80         # lavira-style: 80 step budget
    max_steps_per_rollout_epoch: 400
    auto_reset: False             # keep episodes separate for GRPO grouping
    ignore_terminations: False

    reward_mode: "geo_progress"
    format_reward_coef: 0.5         # per-step bonus for valid JSON parse (breaks cold-start)
    enable_4dir_render: true

    scene_offset: 0

  eval:
    total_num_envs: 6
    group_size: 1
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 400
    auto_reset: True
    ignore_terminations: True
    reward_mode: "geo_progress"
    enable_4dir_render: true
    scene_offset: 0
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_type: "qwen_nav"
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    # Training-mode flags must match actor.model
    collect_forward_inputs: true
    # Paired with algorithm.recompute_prev_logprobs: skip teacher-forcing at rollout
    # to save ~35% rollout time. Actor will overwrite prev_logprobs before training.
    skip_rollout_logprobs: true
    max_new_tokens: ${actor.model.max_new_tokens}
    history_every_k: ${actor.model.history_every_k}
    history_max_frames: ${actor.model.history_max_frames}
    use_4dir: ${actor.model.use_4dir}
    chunk_size: ${actor.model.chunk_size}
    temperature: ${actor.model.temperature}
    do_sample: ${actor.model.do_sample}
    trust_remote_code: ${actor.model.trust_remote_code}
    attn_implementation: ${actor.model.attn_implementation}
    image_size: ${actor.model.image_size}
    # LoRA — must mirror actor.model so sync_model_to_rollout state-dict keys match
    is_lora: ${actor.model.is_lora}
    lora_rank: ${actor.model.lora_rank}
    lora_alpha: ${actor.model.lora_alpha}
    lora_dropout: ${actor.model.lora_dropout}
    lora_target_modules: ${actor.model.lora_target_modules}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 6
  global_batch_size: 48           # 12 envs × 4 rollout_epochs; must be divisible by micro_batch_size × world_size (6×2=12)
  seed: 42
  enable_offload: False

  model:
    # Inherit from model/qwen_nav.yaml, then override for training:
    collect_forward_inputs: true  # enable forward_inputs collection at rollout
    # action_dim here = max_new_tokens (used as logprob single_action_dim in loss)
    # This overrides qwen_nav.yaml's action_dim:1 which is the env action space.
    action_dim: 512               # must equal max_new_tokens (qwen_nav default=512) for action_level logprob_type
    is_lora: false                # set true to enable LoRA finetuning
    add_value_head: false

    # LoRA config (used when is_lora: true)
    lora_rank: 64
    lora_alpha: 128
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

  optim:
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False  # disabled: GradientCheckpointingLayer changes Qwen3_5GatedDeltaNet output in train mode vs eval mode, causing ratio != 1
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: False

critic:
  use_critic_model: False
