defaults:
  - env/genark_r2r@env.train
  - env/genark_r2r@env.eval
  - model/qwen_nav@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# ─── GPU layout (physical indices) ──────────────────────────────────────────
# Launch with: CUDA_VISIBLE_DEVICES=4,5,6,7 bash run_embodiment.sh ...
#
#   GPU 6,7    →  rollout + actor (Qwen3.5-4B FSDP, 2-way sharding) — HEAVY
#   GPU 4,5    →  1 env worker, which spawns K=8 GenesisSceneActors — LIGHT
#                 (scenes_per_gpu=4 → 4 scenes packed per GPU; GPU 4 → scenes
#                  0,2,4,6 ; GPU 5 → scenes 1,3,5,7). Our own free cards, so no
#                  EGL time-slicing with other users' jobs.
#
# Heavy model load (actor+rollout, ~70GB) goes on the fully-free GPUs 6,7; the
# light Genesis scene sims (~few GB each) go on 4,5 — so a partially-occupied
# GPU 5 (shared with other jobs) no longer OOMs the model. GenesisSceneActors
# pin to one GPU each via explicit CUDA_VISIBLE_DEVICES (see GenesisServerPool).
# ─────────────────────────────────────────────────────────────────────────────
cluster:
  num_nodes: 1
  component_placement:
    rollout:
      placement: "4-7"      # physical GPUs 4,5,6,7 → 4-GPU rollout (vLLM ranks)
    actor:
      placement: "4-7"      # collocated with rollout (FSDP world_size 4)
    env:
      placement: "0-3:0"    # 1 env worker process that "owns" physical GPUs 0,1,2,3
                            # 8 GenesisSceneActors packed onto 4 GPUs
                            # (scenes_per_gpu=2; 2 scenes/GPU proven ~42GB)

runner:
  task_type: embodied
  logger:
    log_path: "/home/clk/workspace/results/genark_grpo_qwen_multiscene"
    project_name: rlinf
    experiment_name: "genark_grpo_qwen_multiscene"
    logger_backends: ["tensorboard"]

  max_epochs: 500
  max_steps: -1

  only_eval: False
  val_check_interval: 5
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 4               # 4 episodes per instruction for GRPO
  # AVSPO ACR collapse threshold: tau=1e-6 is a numerical-precision
  # threshold for reward homogeneity, not a task-tuned low-variance cutoff.
  acr_reward_std_threshold: 1.0e-6
  # Separate engineering diagnostic: weak but nonzero reward variance.
  low_reward_std_threshold: 0.05

  # Reinforce-Ada-pos is disabled by default. v1 is intentionally scoped to
  # single-worker episode-overfit validation before it is generalized to the
  # multi-scene training pool.
  reinforce_ada:
    enabled: false
    mode: adaptive_pos             # static_pos | adaptive_pos
    initial_candidates: 4
    retry_batch_size: 4
    max_candidates: 16
    train_group_size: 4
    min_successes: 1
    min_failures: 3
    only_episode_overfit: true
    skip_on_exhaustion: true
    max_exhausted_groups: 10

  # Decision-rollout path caps each env at max_decisions_per_rollout_epoch within
  # ONE epoch (decision_counts/rollout_results_per_env persist across the epoch
  # loop), so epochs 2..N are no-ops and the env sends a single max_dec-length
  # trajectory. The actor's process_nested_dict_for_adv assumes dim0 =
  # rollout_epoch × n_chunk_steps, so rollout_epoch MUST be 1 here (matches the
  # proven single-scene decision-rollout config). >1 crashes the dim0 reshape.
  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  recompute_prev_logprobs: True

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  clip_log_ratio_min: -3.0
  clip_log_ratio_max: 3.0
  value_clip: null
  huber_delta: null

  gamma: 1.0
  gae_lambda: 1.0

  reward_coef: 1.0
  filter_rewards: False

  sampling_params:
    do_sample: True
    temperature_train: 0.6        # 0.4→0.6: recover exploration diversity for GRPO advantage variance
    temperature_eval: -1
    top_k: -1
    top_p: 1.0

  length_params:
    max_new_token: null
    max_length: null
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    # ── Multi-scene config ────────────────────────────────────────────────────
    # DIAGNOSTIC SPEED MODE: K=4 scenes, 16 slots → K_s=4 slots/scene (1 GRPO group
    # each). Halved from 28/7 to iterate ~1.5x faster while verifying the reward-
    # shaping fix (lucky_start SR gate + success_distance 3 + flat wrong_stop).
    # group_size=4 REQUIRES K_s>=4 → 16 slots ⇒ exactly 4 scenes (can't keep 7).
    # Picked the 4 highest-episode-count scenes from the prior 7-list (zsNo=20,
    # QUCTc=16, 2azQ=14, TbHJr=14). Scale back to 28/7 once real clean SR appears.
    # 2 env GPUs (4,5) × scenes_per_gpu=4 = capacity 8 → 4 scenes fit easily.
    # group_size=4 → 4 GRPO groups/rollout epoch (one per scene).
    # rollout_epoch MUST be 1 for the decision-rollout path (see algorithm block).
    # global_batch_size = 128, micro_batch_size = 1, actor world_size = 2
    #   → 128 / (1 × 2) = 64 gradient accumulation steps ✓ (independent of slots)
    # ─────────────────────────────────────────────────────────────────────────
    # ── MODE A (8 GPU, OpenNav R2R-CE 100 subset) ────────────────────────────
    # Use the curated OpenNav_R2R-CE_100_bertidx.json episode subset for training.
    # The scene list below should stay within scenes with available GLB meshes.
    # 8 scenes × group_size 4 = 32 slots. env on GPU 0-3 (scenes_per_gpu=2 → cap 8),
    # rollout+actor on GPU 4-7 (world_size 4 → global_batch 128/(1×4)=32 grad-accum ✓).
    # ─────────────────────────────────────────────────────────────────────────
    episodes_file: /home/clk/workspace/genark/data/datasets/OpenNav_R2R-CE_100_bertidx.json
    total_num_envs: 32            # 8 scenes × K_s=4 slots/scene
    genesis_backend: multiscene
    multi_scene:
      scene_count: 8             # 8 OpenNav scenes with >=4 episodes
      scenes_per_gpu: 2          # 2 scene actors per GPU (~42GB proven)
      scenes:
        - "mp3d/zsNo4HB9uLZ/zsNo4HB9uLZ.glb"
        - "mp3d/TbHJrupSAjP/TbHJrupSAjP.glb"
        - "mp3d/QUCTc6BB5sX/QUCTc6BB5sX.glb"
        - "mp3d/2azQ1b91cZZ/2azQ1b91cZZ.glb"
        - "mp3d/Z6MFQCViBuw/Z6MFQCViBuw.glb"
        - "mp3d/x8F5xyUWy9e/x8F5xyUWy9e.glb"
        - "mp3d/X7HyMhZNoso/X7HyMhZNoso.glb"
        - "mp3d/EU6Fwq7SyZv/EU6Fwq7SyZv.glb"
      gpu_budget: 4              # physical GPUs 0-3; capacity = 4 × 2 = 8

    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    max_episode_steps: 80
    max_decisions_per_rollout_epoch: 20
    max_steps_per_rollout_epoch: 200
    auto_reset: False
    ignore_terminations: False

    cyclic_episode_sampling: true
    episode_balanced_sampling: true   # within-scene (seen_count, success_rate) balanced sampling
    curriculum_dtg_start: 5.0         # cold-start: only episodes ≤5m euclidean. With
                                      # success_distance=3, these need 0–2m real nav.
    curriculum_dtg_step: 5.0          # each coverage pass unlocks +5m (5→10→15→… up to full pool)
    reward_mode: "decision_nav"   # low-level DTG progress + terminal navigation reward
    # Reward profile:
    #   nav             = task reward for navigation / correct STOP.
    #   format_learning = schema + bbox warm-up for cold-start checkpoints.
    reward_profile: "nav"
    decision_level_ndtw: true
    geo_coef: 0.1
    geo_step_clip: 0.5
    ndtw_coef: 0.5
    sr_coef: 2.0
    # LaViRA waypoint schema shaping: dense valid-schema reward capped per episode,
    # plus bbox/point geometry reward via ACTION_PARSE_OK_HAS_BBOX sentinel.
    format_reward_coef: 0.05
    format_reward_cap: 1.0
    structured_reward_cap: 1.0
    json_reward_coef: 0.05
    struct_reward_coef: 0.05
    field_format_reward_coef: 0.05
    length_reward_coef: 0.02
    bbox_reward_cap: 2.0
    bbox_reward_coef: 0.2
    parse_fail_penalty: -1.0
    no_stop_penalty: 0.0
    # Nav-R1-style terminal reward: path fidelity (nDTW proxy) + endpoint accuracy.
    nav_terminal_reward_enabled: false
    nav_path_coef: 1.0
    nav_endpoint_coef: 1.0
    nav_endpoint_decay: 0.2
    # Best-progress is retained as a small auxiliary signal for all-failure groups.
    process_reward_enabled: false
    process_progress_coef: 0.2
    process_progress_cap: 1.0
    gsam_reward_enabled: false
    gsam_detect_progress_bonus: 0.05
    enable_4dir_render: true
    # Reward-shaping fix (degenerate "STOP-in-place" optimum diagnosis):
    # - success_distance 5.0→3.0: 5m was so wide that curriculum-spawned (≤5m)
    #   episodes were "born successful" → STOP immediately harvested +sr_coef for
    #   ~0 navigation. 3m forces real approach (paired with lucky_start SR gate in
    #   genark_env._compute_ndtw_sr_delta_reward — born-within-3m gets NO SR).
    # - wrong_stop_penalty -2.0→-0.5 flat by default.  For the STOP ablation,
    #   conditional_wrong_stop_penalty can be enabled from the launch script to
    #   scale this penalty by clipped stop_dtg/start_dtg.
    wrong_stop_penalty: -0.5
    conditional_wrong_stop_penalty: false
    conditional_wrong_stop_ratio_min: 0.5
    conditional_wrong_stop_ratio_max: 2.0
    success_distance: 3.0
    # Robostral-inspired Euclidean terminal score. Opt-in; default off so the
    # existing curriculum RLOO launcher stays a regression baseline.
    terminal_navigation_score:
      enabled: false
      distance_floor_m: 2.0
      # Training default is endpoint-only. Clean STOP is logged, not rewarded.
      clean_stop_bonus: 0.0
    episode_assignment:
      enabled: false
      file: null
    episode_blocklist: []
    hard_pool:
      enabled: false
      manifest_file: null
      mixed_support_weight: 0.6
      navigation_hard_weight: 0.4
      seed: 6091200

    scene_offset: 0

  eval:
    # ── Multi-scene eval ───────────────────────────────────────────────────────
    # Evaluate on the same OpenNav_R2R-CE_100_bertidx.json file.  Eval uses
    # group_size=1, so the low-count scenes (3 eps / 1 ep) are valid here even
    # though they are excluded from train's group_size=4 layout.
    # ───────────────────────────────────────────────────────────────────────────
    episodes_file: /home/clk/workspace/genark/data/datasets/OpenNav_R2R-CE_100_bertidx.json
    total_num_envs: 10
    genesis_backend: multiscene
    multi_scene:
      scene_count: 10
      scenes_per_gpu: 3
      scenes:
        - "mp3d/zsNo4HB9uLZ/zsNo4HB9uLZ.glb"
        - "mp3d/TbHJrupSAjP/TbHJrupSAjP.glb"
        - "mp3d/QUCTc6BB5sX/QUCTc6BB5sX.glb"
        - "mp3d/2azQ1b91cZZ/2azQ1b91cZZ.glb"
        - "mp3d/Z6MFQCViBuw/Z6MFQCViBuw.glb"
        - "mp3d/x8F5xyUWy9e/x8F5xyUWy9e.glb"
        - "mp3d/X7HyMhZNoso/X7HyMhZNoso.glb"
        - "mp3d/EU6Fwq7SyZv/EU6Fwq7SyZv.glb"
        - "mp3d/oLBMNvg9in8/oLBMNvg9in8.glb"
        - "mp3d/8194nk5LbLH/8194nk5LbLH.glb"
      gpu_budget: 4
    group_size: 1
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 400
    auto_reset: True
    ignore_terminations: True
    reward_mode: "geo_progress"
    enable_4dir_render: true
    success_distance: 3.0          # match train threshold (reverted 5.0→3.0)
    scene_offset: 0
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "vllm_embodied"          # vllm_embodied | huggingface
  enable_offload: False
  pipeline_stage_num: 1

  # ── vLLM engine parameters (only used when backend=vllm_embodied) ─────────
  tensor_parallel_size: 1           # 1 GPU per vLLM engine (shares GPU 6,7 with FSDP actor)
  gpu_memory_utilization: 0.18      # opt2 sleep is DISABLED (vLLM mm-cache corrupts across
                                    # sleep/wake), so vLLM stays resident during the actor
                                    # train step. With opt1 (rollout HF on CPU, ~14G freed):
                                    # actor(~49G)+vLLM(0.18→~16G)+HF(CPU,0)=~65G/79G — fits.
                                    # KV concurrency doesn't bottleneck rollout (Genesis-bound).
  vllm_sleep_offload: false         # do NOT enable until vLLM sleep/wake mm-cache bug fixed
  max_model_len: 4096
  max_num_seqs: 32
  enforce_eager: true               # skip CUDA graph capture for first run; set false once stable
  enable_sleep_mode: true           # release KV cache when actor is training
  # ─────────────────────────────────────────────────────────────────────────
  model:
    model_type: "qwen_nav"
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    collect_forward_inputs: true
    skip_rollout_logprobs: true
    max_new_tokens: ${actor.model.max_new_tokens}
    history_every_k: ${actor.model.history_every_k}
    history_max_frames: ${actor.model.history_max_frames}
    use_4dir: ${actor.model.use_4dir}
    chunk_size: ${actor.model.chunk_size}
    temperature: ${actor.model.temperature}
    do_sample: ${actor.model.do_sample}
    trust_remote_code: ${actor.model.trust_remote_code}
    attn_implementation: ${actor.model.attn_implementation}
    image_size: ${actor.model.image_size}
    prompt_style: ${actor.model.prompt_style}
    lavira_runtime: ${actor.model.lavira_runtime}
    grounded_sam: ${actor.model.grounded_sam}
    is_lora: ${actor.model.is_lora}
    lora_rank: ${actor.model.lora_rank}
    lora_alpha: ${actor.model.lora_alpha}
    lora_dropout: ${actor.model.lora_dropout}
    lora_target_modules: ${actor.model.lora_target_modules}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1             # matches proven single-scene; mbs=4 OOMs on
                                  # long multimodal seqs (max_seq_len≈3547, 12 imgs).
                                  # 32 % (1×2) = 0 ✓
  global_batch_size: 128          # actor train minibatch; must be divisible by
                                  # micro_batch_size(1) × actor_world_size(2) = 2
  seed: 42
  enable_offload: False

  model:
    # Frozen LaViRA SFT initialization used to build the episode-difficulty
    # manifest and to start RFT. Do not substitute an episode-609 RFT resume
    # checkpoint when measuring the baseline curriculum distribution.
    model_path: /home/lhx/workspace/test_model/output/qwen3.5_v2_unfreeze_vit_nav_target/v0-20260709-081633/checkpoint-1200
    collect_forward_inputs: true
    # flash_attn not installed in genesis-vllm (vLLM backend replaces generation
    # anyway). Use sdpa for HF forward/logprob path; vLLM uses its own kernel.
    attn_implementation: "sdpa"
    # Memory-footprint overrides matching the proven single-scene lora run.
    # Without these the base qwen_nav defaults (max_new_tokens=512,
    # history_max_frames=8, action_dim=512) inflate the rollout KV-cache +
    # vision tokens to ~62GB and OOM the actor/rollout GPU. These propagate to
    # env.train.model / rollout via the ${actor.model.*} references.
    action_dim: 256                 # was 512
    max_new_tokens: 256             # base 512 → 256 (shorter gen, smaller KV cache)
    history_max_frames: 2           # base 8 → 4 (fewer vision tokens)
    chunk_size: 16                  # base 4 → 16 (matches single-scene)
    # LoRA (matches the proven single-scene config). Full FT (is_lora=false) of
    # Qwen3.5-4B needs ~48GB (model+grad+Adam fp32 states) and OOMs when the env
    # worker's scene actors or other jobs share the actor/rollout GPUs. LoRA cuts
    # the actor to ~15GB.
    is_lora: true
    add_value_head: false
    lora_rank: 32                    # 64→32: smaller rank, scale alpha/rank 2.0→1.0
    lora_alpha: 32                   # 128→32: more conservative LoRA updates
    lora_dropout: 0.05               # 0.0→0.05: light regularization
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

  optim:
    lr: 5.0e-7                     # 1e-7→5e-7: 5× increase; net LoRA delta ~2.5× vs
                                   # before (alpha/rank halved from 2.0→1.0); well below
                                   # collapse threshold (5e-6 caused collapse at scale=2)
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    # MUST stay False: Qwen3_5GatedDeltaNet is a recurrent *stateful* layer (delta-rule
    # linear attention updates a running hidden state per token). torch.utils.checkpoint
    # assumes the checkpointed fn is PURE — recomputing the stateful layer in backward
    # corrupts logprobs, so the prev-recompute path (no_grad, no ckpt) diverges from the
    # training forward (ckpt) → PPO ratio mismatch, amplified by action-level token-sum
    # → exp() blows up to 1e9~1e20. We briefly set True to fix a collocation OOM, but
    # opt1 (rollout HF parked on CPU) + opt2 (vLLM sleep during actor train) already free
    # ~42G, so the actor's ~49G fits without checkpointing. Keep False.
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: False

critic:
  use_critic_model: False
