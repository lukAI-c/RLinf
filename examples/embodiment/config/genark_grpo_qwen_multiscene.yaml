defaults:
  - env/genark_r2r@env.train
  - env/genark_r2r@env.eval
  - model/qwen_nav@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# ─── GPU layout (physical indices) ──────────────────────────────────────────
# Launch with: CUDA_VISIBLE_DEVICES=4,5,6,7 bash run_embodiment.sh ...
#
#   GPU 6,7    →  rollout + actor (Qwen3.5-4B FSDP, 2-way sharding) — HEAVY
#   GPU 4,5    →  1 env worker, which spawns K=8 GenesisSceneActors — LIGHT
#                 (scenes_per_gpu=4 → 4 scenes packed per GPU; GPU 4 → scenes
#                  0,2,4,6 ; GPU 5 → scenes 1,3,5,7). Our own free cards, so no
#                  EGL time-slicing with other users' jobs.
#
# Heavy model load (actor+rollout, ~70GB) goes on the fully-free GPUs 6,7; the
# light Genesis scene sims (~few GB each) go on 4,5 — so a partially-occupied
# GPU 5 (shared with other jobs) no longer OOMs the model. GenesisSceneActors
# pin to one GPU each via explicit CUDA_VISIBLE_DEVICES (see GenesisServerPool).
# ─────────────────────────────────────────────────────────────────────────────
cluster:
  num_nodes: 1
  component_placement:
    rollout:
      placement: "6-7"      # physical GPUs 6,7 → 2-GPU rollout (FSDP)
    actor:
      placement: "6-7"      # collocated with rollout
    env:
      placement: "4-5:0"    # 1 env worker process that "owns" physical GPUs 4,5
                            # K=8 GenesisSceneActors packed onto 2 GPUs
                            # (scenes_per_gpu=4; our own cards, no external jobs)

runner:
  task_type: embodied
  logger:
    log_path: "/home/clk/workspace/results/genark_grpo_qwen_multiscene"
    project_name: rlinf
    experiment_name: "genark_grpo_qwen_multiscene"
    logger_backends: ["tensorboard"]

  max_epochs: 500
  max_steps: -1

  only_eval: False
  val_check_interval: 50
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 4               # 4 episodes per instruction for GRPO

  # Decision-rollout path caps each env at max_decisions_per_rollout_epoch within
  # ONE epoch (decision_counts/rollout_results_per_env persist across the epoch
  # loop), so epochs 2..N are no-ops and the env sends a single max_dec-length
  # trajectory. The actor's process_nested_dict_for_adv assumes dim0 =
  # rollout_epoch × n_chunk_steps, so rollout_epoch MUST be 1 here (matches the
  # proven single-scene decision-rollout config). >1 crashes the dim0 reshape.
  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  recompute_prev_logprobs: True

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  clip_log_ratio_min: -3.0
  clip_log_ratio_max: 3.0
  value_clip: null
  huber_delta: null

  gamma: 1.0
  gae_lambda: 1.0

  reward_coef: 1.0
  filter_rewards: False

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: -1
    top_k: -1
    top_p: 1.0

  length_params:
    max_new_token: null
    max_length: null
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    # ── Multi-scene config ────────────────────────────────────────────────────
    # 1 env worker, K=8 scenes, 32 slots → K_s=4 slots/scene (1 GRPO group each).
    # 2 env GPUs (4,5) × scenes_per_gpu=4 = capacity 8 → 4 scenes packed per GPU.
    # group_size=4 → 8 GRPO groups/rollout epoch (one per scene).
    # rollout_epoch MUST be 1 for the decision-rollout path (see algorithm block).
    # global_batch_size = 128, micro_batch_size = 1, actor world_size = 2
    #   → 128 / (1 × 2) = 64 gradient accumulation steps ✓
    # NOTE: 32 slots ≈ 4× rollout inference cost vs the K=2/8-slot config.
    #       Covers all 8 scenes with >= group_size episodes (2 tiny scenes with
    #       1 / 3 episodes can't fill a group_size=4 block and are excluded).
    # ─────────────────────────────────────────────────────────────────────────
    total_num_envs: 32            # 1 worker × 32 slots (K_s=4 per scene × K=8)
    genesis_backend: multiscene
    multi_scene:
      scene_count: 8             # K=8 scenes per worker (all coverable scenes)
      scenes_per_gpu: 4          # pack up to 4 scene actors per physical GPU
      scenes: null
      gpu_budget: 2              # physical GPUs 4,5; capacity = 2 × 4 = 8

    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    max_episode_steps: 80
    max_decisions_per_rollout_epoch: 20
    max_steps_per_rollout_epoch: 200
    auto_reset: False
    ignore_terminations: False

    cyclic_episode_sampling: true
    episode_balanced_sampling: true   # within-scene (seen_count, success_rate) balanced sampling
    reward_mode: "geo_ndtw"
    decision_level_ndtw: true
    geo_coef: 0.0
    ndtw_coef: 1.0
    sr_coef: 2.0
    format_reward_coef: 0.0
    decision_dtg_coef: 1.0         # no-op in geo_ndtw mode (only used by decision_nav)
    decision_dtg_clip: 2.0
    enable_4dir_render: true
    # Aligned with the proven single-scene lora run (run_qwen_rft.sh):
    # wrong_stop_penalty -0.5(code default)→-2.0 strengthens the early-stop
    # penalty so the model is pushed to keep exploring instead of STOP-ing early
    # (96% of episodes were wrong_stop). success_distance 3.0→5.0 widens the
    # success threshold so cold-start GRPO groups get positive samples and
    # within-group reward variance (otherwise advantages collapse to 0).
    wrong_stop_penalty: -2.0
    success_distance: 5.0

    scene_offset: 0

  eval:
    total_num_envs: 4
    genesis_backend: local        # eval uses single-scene local backend
    group_size: 1
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 400
    auto_reset: True
    ignore_terminations: True
    reward_mode: "geo_progress"
    enable_4dir_render: true
    success_distance: 5.0          # match train threshold (proven single-scene)
    scene_offset: 0
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_type: "qwen_nav"
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    collect_forward_inputs: true
    skip_rollout_logprobs: true
    max_new_tokens: ${actor.model.max_new_tokens}
    history_every_k: ${actor.model.history_every_k}
    history_max_frames: ${actor.model.history_max_frames}
    use_4dir: ${actor.model.use_4dir}
    chunk_size: ${actor.model.chunk_size}
    temperature: ${actor.model.temperature}
    do_sample: ${actor.model.do_sample}
    trust_remote_code: ${actor.model.trust_remote_code}
    attn_implementation: ${actor.model.attn_implementation}
    image_size: ${actor.model.image_size}
    is_lora: ${actor.model.is_lora}
    lora_rank: ${actor.model.lora_rank}
    lora_alpha: ${actor.model.lora_alpha}
    lora_dropout: ${actor.model.lora_dropout}
    lora_target_modules: ${actor.model.lora_target_modules}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1             # matches proven single-scene; mbs=4 OOMs on
                                  # long multimodal seqs (max_seq_len≈3547, 12 imgs).
                                  # 32 % (1×2) = 0 ✓
  global_batch_size: 128          # actor train minibatch; must be divisible by
                                  # micro_batch_size(1) × actor_world_size(2) = 2
  seed: 42
  enable_offload: False

  model:
    collect_forward_inputs: true
    # Memory-footprint overrides matching the proven single-scene lora run.
    # Without these the base qwen_nav defaults (max_new_tokens=512,
    # history_max_frames=8, action_dim=512) inflate the rollout KV-cache +
    # vision tokens to ~62GB and OOM the actor/rollout GPU. These propagate to
    # env.train.model / rollout via the ${actor.model.*} references.
    action_dim: 256                 # was 512
    max_new_tokens: 256             # base 512 → 256 (shorter gen, smaller KV cache)
    history_max_frames: 4           # base 8 → 4 (fewer vision tokens)
    chunk_size: 16                  # base 4 → 16 (matches single-scene)
    # LoRA (matches the proven single-scene config). Full FT (is_lora=false) of
    # Qwen3.5-4B needs ~48GB (model+grad+Adam fp32 states) and OOMs when the env
    # worker's scene actors or other jobs share the actor/rollout GPUs. LoRA cuts
    # the actor to ~15GB.
    is_lora: true
    add_value_head: false
    lora_rank: 64
    lora_alpha: 128
    lora_dropout: 0.0
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

  optim:
    lr: 1.0e-7                     # matches proven single-scene; 5e-6 was 50× too
                                   # high → GRPO policy collapse (steps→0, reward↓)
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: False

critic:
  use_critic_model: False
