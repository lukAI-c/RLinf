# GenArk eval-only config (Step 4 — validate env before training)
# Usage:
#   cd /home/clk/workspace/RLinf
#   python examples/embodiment/train_embodied_agent.py \
#       --config-name genark_eval_only \
#       rollout.model.model_path=/home/nvme03/lck/genark/model_zoo/uninavid-7b-full-224-video-fps-1-grid-2

defaults:
  - env/genark_r2r@env.train
  - env/genark_r2r@env.eval
  - model/uninavid@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # only_eval=True: Actor worker is skipped entirely (not created)
    # Ray placement uses physical GPU indices directly
    actor:
      placement: 2        # placeholder — actor is never launched in only_eval mode
    rollout:
      placement: 2        # physical GPU 2: Rollout inference ~14GB
    env:
      placement: 3-7      # GPUs 3-7: 5 Env Workers, each pinned to a distinct scene
                          # (genark_env.py uses unique_scenes[rank] for round-robin)

runner:
  task_type: embodied
  only_eval: True
  eval_policy_path: null
  val_check_interval: 1
  save_interval: 999999
  max_epochs: 1
  max_steps: -1

  logger:
    log_path: "../results/genark_eval"
    project_name: rlinf
    experiment_name: "genark_eval_uninavid"
    logger_backends: ["tensorboard"]

algorithm:
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  group_size: 1
  reward_coef: 1.0
  normalize_advantages: True
  loss_type: embodied_dagger      # eval-only: skip value_head requirement
  replay_buffer:
    enable_cache: false
    cache_size: 1
    sample_window_size: 1
    auto_save: false
  adv_type: gae
  recompute_logprobs: False
  kl_penalty: kl
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  update_epoch: 4
  loss_agg_func: "token-mean"
  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  length_params:
    max_new_token: null
    max_length: 512
    min_length: 1
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 0.1
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 1   # only_eval=True so train envs never actually run; must be non-null
  eval:
    total_num_envs: 40   # 5 Env Workers × 8 envs/worker (each worker = 1 scene)
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 600  # 500 ep steps + buffer; each env completes ≥1 episode
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
      info_on_video: False
      fps: 3

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    # Only model_path and precision are read from here;
    # model_type and other params come from actor.model (see defaults above)
    model_path: ${actor.model.model_path}  # mirrors actor.model.model_path
    precision: "bf16"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 42
  enable_offload: True      # offload actor weights to CPU when not training
  fsdp_config:
    use_orig_params: true   # UniNaVid has mixed requires_grad (frozen vision tower)
    cpu_offload: true       # offload optimizer states to CPU to avoid OOM on shared GPU
  optim:
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  model:
    num_action_chunks: 1  # nav is single-step; required by rollout worker step calc
