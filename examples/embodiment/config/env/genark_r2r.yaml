env_type: genark

seed: 0
group_size: 1
reward_coef: 1.0
use_rel_reward: True
total_num_envs: null
auto_reset: True
ignore_terminations: False
max_steps_per_rollout_epoch: 1200  # 500 steps/ep × num_envs buffer, ensures episodes complete
max_episode_steps: 500

# Video recording (used by RLinf env worker)
video_cfg:
  save_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

# Genesis simulator params (mirror genark configs/uninavid_r2r.yaml)
camera_height: 1.25
step_move: 0.25
step_turn: 0.5236  # 30 degrees in radians
allow_sliding: true
max_step_height: 0.5
agent_radius: 0.18
light_scale: 4.0
fov: 105
cam_res: [640, 480]
max_seq_len: 256

# Multi-pass scene traversal offset (rank i picks unique_scenes[(scene_offset+i) % N])
# Used only when genesis_backend != "multiscene".
scene_offset: 0

# Genesis backend: "local" | "remote" | "zmq" | "multiscene"
genesis_backend: local

# Multi-scene pool (only active when genesis_backend: "multiscene").
# Each env worker preloads K scenes concurrently; K = scene_count GPUs per worker.
# GPU budget: env workers MUST be on separate GPUs from the policy model —
# Ray num_gpus=1 actors will contend with policy GPUs and deadlock otherwise.
#
# Scene assignment: worker w gets scenes[w*scene_count : (w+1)*scene_count] (mod M),
# so workers cover disjoint scene windows automatically.
# Alternatively, set scenes: [list of explicit scene_ids] to override.
#
# Invariants checked at startup (ValueError if violated):
#   len(eps_s) >= slots_per_scene  (fully-active blocks)
#   slots_per_scene % group_size == 0  (groups never straddle scenes)
#   scene_count <= gpu_budget (if set)
multi_scene:
  scene_count: 2       # K: number of scenes per worker (= K GPUs per worker)
  scenes: null         # explicit list of scene_ids; overrides scene_count if set
  gpu_budget: null     # optional: max K; raises ValueError if exceeded

# Task params
success_distance: 3.0
success_bonus: 2.5

# Reward mode: "geo_progress" (default) | "ndtw_sr_delta" (RFT, see caveats C4-C6)
reward_mode: "geo_progress"
ndtw_coef: 1.0
sr_coef:   10.0

# 4-dir rendering: render left/right/behind in addition to front (3× cost).
# Required by QwenNavPolicy lavira-style prompt; outputs go to extra_view_images.
enable_4dir_render: false

init_params:
  episodes_file: /home/nvme03/lck/genark/data/datasets/OpenNav_R2R-CE_100_bertidx.json
  scene_datasets: /home/nvme03/lck/genark/scene_datasets
  glb_cache_dir: /home/clk/workspace/genark/glb_cache
